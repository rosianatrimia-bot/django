{% extends 'base.html' %}

{% block title %}
    {{ page_title }}
{% endblock title %}

{% block contents %}

<div class="container">
    <h2>{{ page_title }}</h2>

    <form method="POST" class="form-box">
        {% csrf_token %}

        <div class="form-group">
            <label>Nama depan</label>
            {{ akun_form.nama_depan }}
        </div>

        <div class="form-group">
            <label>Nama belakang</label>
            {{ akun_form.nama_belakang }}
        </div>

        <div class="form-group">
            <label>Username</label>
            {{ akun_form.username }}
        </div>

        <div class="form-action">
            <button type="submit" class="btn-simpan">
                Simpan
            </button>

            <a href="{% url 'sosmed:list' %}" class="btn-kembali">
                Kembali
            </a>
        </div>
    </form>
</div>

{% endblock contents %}
